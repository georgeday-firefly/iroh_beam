[package]
name = "iroh_beam_nif"
version = "0.2.0"
edition = "2021"
publish = false
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[dependencies]
bytes = "=1.12.1"
iroh = { version = "=1.3.0", default-features = false, features = ["metrics", "tls-ring"] }
iroh-services = "=2.0.0"
iroh-tickets = "=1.0.0"
rustler = "=0.38.0"
tokio = { version = "=1.53.1", features = ["net", "rt-multi-thread", "sync", "time"] }

# RUSTSEC-2026-0185 (unbounded stream reassembly) is unfixed in noq 1.3.0.
# Pin the fix from n0-computer/noq#828 until a patched noq-proto is released.
[patch.crates-io]
noq = { git = "https://github.com/moq-dev/noq", rev = "d7c3160a7e7b5cb36682eae04e364d3f50e28925" }
noq-proto = { git = "https://github.com/moq-dev/noq", rev = "d7c3160a7e7b5cb36682eae04e364d3f50e28925" }
noq-udp = { git = "https://github.com/moq-dev/noq", rev = "d7c3160a7e7b5cb36682eae04e364d3f50e28925" }
