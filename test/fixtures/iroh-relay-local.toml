# Same relay as iroh-relay.toml, bound to loopback for the native binary
# (IROH_BEAM_RELAY_BIN). The access token comes from IROH_RELAY_ACCESS_TOKEN.
enable_relay = true
http_bind_addr = "127.0.0.1:3340"
enable_quic_addr_discovery = false
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"
key_cache_capacity = 1024
access.shared_token = ["iroh-beam-placeholder-test-token"]
